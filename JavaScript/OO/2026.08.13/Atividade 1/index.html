<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Produto</h1>

        <form id="formProduto">
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>
            </div>

            <div class="campo">
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" min="0.01" step="0.01" required>
            </div>

            <div class="campo">
                <label for="categoria">Categoria:</label>
                <input type="text" id="categoria" required>
            </div>

            <div class="campo">
                <label for="desconto">Desconto (%):</label>
                <input type="number" id="desconto" min="0" max="100" step="0.01" required>
            </div>

            <button type="submit">Cadastrar Produto</button>
        </form>

        <div id="resultado" class="resultado">
            <h2>Produto cadastrado</h2>
            <p id="dadosProduto">Preencha o formulário para cadastrar um produto.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
