<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8"> 
    <title>Cadastro</title> 
    
    <!-- Importação do CSS para estilizar a página -->
    <link rel="stylesheet" href="style.css"> 
    
    <!-- Biblioteca de ícones (usada para olho da senha e botão de adicionar telefone) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- Formulário de cadastro de usuário -->
    <form>

        <!-- Container principal que organiza todo o conteúdo -->
        <div class="container">
            <h2>Cadastro de Usuário</h2>

            <!-- Cada campo está separado em blocos para facilitar estilização e validação -->
            
            <!-- Nome -->
            <div class="container-input">
                <label>Nome:</label>
                <input type="text" id="nome" class="input" placeholder="Digite seu nome:" required><br>
                <span id="msgNome"></span> <!-- Área para mensagens de erro/validação -->
            </div>

            <!-- Email -->
            <div class="container-input">
                <label>Email:</label>
                <input type="email" id="email" class="input" placeholder="email@email.com" required><br>
                <span id="msgEmail"></span>
            </div>

            <!-- Senha com ícone para mostrar/ocultar -->
            <div class="container-input">
                <label>Senha:</label>
                <input type="password" id="senha" class="input" placeholder="Sua senha:" required>
                <i class="bi bi-eye-fill icon" id="eye"></i>
                <span id="msgSenha"></span>
            </div>

            <!-- Confirmação de senha -->
            <div class="container-input">
                <label>Confirmar senha:</label>
                <input type="password" id="confirmarSenha" class="input" placeholder="Confirme sua senha:" required>
                <i class="bi bi-eye-fill icon" id="eyeConfirmar"></i>
                <span id="msgConfirmarSenha"></span>
            </div>

            <!-- Endereço -->
            <div class="container-input">
                <label>Endereço</label>
                <input type="text" id="endereco" class="input" placeholder="Seu endereço:" required><br>
                <span id="msgEndereco"></span>
            </div>

            <!-- Telefone com opção de adicionar vários números -->
            <div class="container-input">
                <label>Telefones:</label>
                <input type="text" id="telefone" class="input" placeholder="Seu telefone:" required maxlength="11"><br>
                <i class="bi bi-plus-circle icon" id="plus"></i>
                <span id="msgTelefone"></span>

                <!-- Lista onde os telefones adicionados vão aparecer -->
                <ul id="lista"></ul>
            </div>

            <!-- Botão controlado por JavaScript (não envia automaticamente) -->
            <button type="button" id="cadastrar">Cadastrar</button><br>

            <!-- Mensagem final de sucesso ou erro -->
            <span id="msgButton"></span>

        </div>
    </form>

    <!-- Script responsável pelas validações e interações -->
    <script src="script.js"></script>

</body>

</html>
