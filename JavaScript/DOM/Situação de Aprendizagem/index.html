<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2>Cadastro de Usuário</h2>

            <form id="formCadastro">
                <div class="input-group">
                    <input type="text" id="nome" placeholder="Nome completo" required>
                </div>

                <div class="input-group">
                    <input type="email" id="email" placeholder="Email" required>
                    <span class="error-message" id="email-error"></span>
                </div>

                <div class="input-group password-group">
                    <input type="password" id="senha" placeholder="Senha" required>
                    <span class="toggle-password" id="toggle-password">
                        <i class="material-icons eye-icon">visibility_off</i>
                    </span>
                    <div class="strength-indicator" id="strength-indicator">
                        <div class="strength-bar" id="strength-bar"></div>
                        <span id="strength-text"></span>
                    </div>
                </div>

                <div class="input-group">
                    <input type="password" id="confirmasenha" placeholder="Confirmar senha" required>
                    <span class="error-message" id="confirm-error"></span>
                </div>

                <button type="button" id="cadastrar">Cadastrar</button>
            </form>

            <p id="mensagem"></p>
        </div>

        <!-- Lista de cadastros -->
        <div class="lista-container" id="listaContainer" style="display: none;">
            <h3>Usuários Cadastrados</h3>
            <ul id="listaUsuarios"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
