<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos - Web Storage</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Cadastro de Produtos</h1>
        <p>Atividade Prática - Web Storage</p>
    </header>

    <main>

        <section class="formulario">
            <h2>Cadastrar Produto</h2>

            <form id="produtoForm">

                <div class="campo">
                    <label for="nome">Nome do produto</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome do produto"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="preco">Preço</label>
                    <input
                        type="number"
                        id="preco"
                        placeholder="Digite o preço"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="desconto">Desconto (%)</label>
                    <input
                        type="number"
                        id="desconto"
                        placeholder="Ex: 10"
                        min="0"
                        max="100"
                        value="0"
                        required
                    >
                </div>

                <button type="submit">
                    Adicionar Produto
                </button>

            </form>
        </section>


        <section class="produtos">

            <div class="titulo-produtos">
                <h2>Produtos cadastrados</h2>

                <button
                    type="button"
                    id="limparTudo"
                    class="btn-limpar"
                >
                    Limpar todos
                </button>
            </div>

            <div id="listaProdutos"></div>

        </section>

    </main>

    <footer>
        <p>Sistema de Cadastro de Produtos - Web Storage</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
